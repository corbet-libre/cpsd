schema = 1
project = "cpsd"

[checks.verify]
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["node", "--version"], ["python3", "--version"], ["curl", "--version"], ["chromedriver", "--version"], ["chromium", "--version"], ["cargo", "fuzz", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"], ["pkg-config", "--version"], ["clang", "--version"]]
cache_env = ["LIBCLANG_PATH", "PKG_CONFIG_PATH", "NIX_CFLAGS_COMPILE", "NIX_LDFLAGS", "LD_LIBRARY_PATH"]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt", "dependency-metadata.json"]

[checks.advisories]
kind = "commands"
commands = [["cargo", "deny", "--locked", "check", "advisories", "licenses"], ["cargo", "deny", "--manifest-path", "fuzz/Cargo.toml", "--locked", "check", "advisories", "licenses"]]

[checks.resolve-dependencies]
kind = "commands"
commands = [["bash", ".ci/resolve-dependencies.sh"]]
cache = false
cache_outputs = ["Cargo.lock", "fuzz/Cargo.lock"]

[render]
tool_revision = "bd9aff07073185fb0a3503bab331aedefb6d8fd2"
tool_sha256 = "38c0eadf2a2adb406f83c7d4892bc01a0a10b95671e1e671358e43a257bb5d23"
[jobs.verify]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["verify", "advisories"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]

# Retain the reviewed integration graph before a separate locked verification.
[jobs.resolve-dependencies]
scheduler = "forgejo"
runs_on = "heavy"
checks = ["resolve-dependencies"]
workflow = "resolve-dependencies"
command = ["bash", ".ci/run-cached.sh"]
events = ["manual"]
