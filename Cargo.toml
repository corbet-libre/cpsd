[package]
name = "cpsd"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Pseudonyms: blind credential issuance and unlinkable per-community pseudonyms"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-foss/cpsd.git"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

# Compatible ranges follow the upstream Dock family. Its public types currently
# use arkworks 0.4; a new minor family requires the real proof compatibility suite.
[features]
default = ["storage"]
storage = ["dep:crlt"]

[dependencies]
rand_chacha = "0.3"
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn.git", branch = "v01", default-features = false }
ark-bls12-381 = { version = "0.4.0", default-features = false, features = ["curve"] }
ark-ec = { version = "0.4.2", default-features = false }
ark-ff = { version = "0.4.2", default-features = false }
ark-serialize = { version = "0.4.2", default-features = false }
ark-std = { version = "0.4.0", default-features = false }
bbs_plus = { version = "0.25.0", default-features = false }
blake2 = { version = "0.10.6", default-features = false }
bulletproofs_plus_plus = { version = "0.9.0", default-features = false }
dock_crypto_utils = { version = "0.23.0", default-features = false }
schnorr_pok = { version = "0.23.0", default-features = false }
zeroize = { version = "1.9", features = ["derive"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crlt = { git = "https://git.corbet.ch/corbet-foss/crlt.git", branch = "v01", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Keep browser bridge dependencies compatible with downstream device crates.
# CI resolves one lock and installs its exact matching browser test runner.
wasm-bindgen = "0.2.104"
js-sys = "0.3.81"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn.git", branch = "v01", features = ["volatile-signer"] }
rand = { version = "0.8", features = ["std_rng"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.54"
web-sys = { version = "0.3.81", features = ["Window", "Performance"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# Pairing arithmetic is 10-50x slower without optimisation; tests (including the
# performance measurement) run against optimised dependencies.
[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 3

# Browser latency is measured with the deployment profile, including
# cross-crate optimization of the field/curve arithmetic.
[profile.release]
lto = "thin"
codegen-units = 1
