name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
      - run: rustc --version
      - run: cargo fmt --all --check
      - run: node --test .github/check-pins.test.mjs
      - run: cargo metadata --locked --format-version 1 > dependency-metadata.json
      - run: node .github/check-pins.mjs dependency-metadata.json
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -- --nocapture
        env:
          CPSD_FUZZ_CORPUS: fuzz/corpus/decode_encode
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuzz-corpus
          path: fuzz/corpus/decode_encode
      - run: cargo check --locked --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
        with:
          tool: wasm-bindgen-cli@0.2.104
      - name: Browser round trips and timing
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          WASM_BINDGEN_USE_BROWSER: "1"
          WASM_BINDGEN_TEST_TIMEOUT: "120"
        run: |
          export CHROMEDRIVER="$(command -v chromedriver)"
          google-chrome --version
          cargo test --release --locked --target wasm32-unknown-unknown --test browser -- --nocapture
      - name: Dependency license inventory
        if: always()
        run: |
          cargo metadata --locked --format-version 1 > dependency-metadata.json
          node .github/check-licenses.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cargo-lock
          path: |
            Cargo.lock
            dependency-metadata.json

  fuzz:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: fuzz
          cache-on-failure: true
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
        with:
          tool: cargo-fuzz
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fuzz-corpus
          path: fuzz/corpus/decode_encode
      - name: Fuzz decode-encode identity
        run: |
          cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
          cargo fuzz run decode_encode --target x86_64-unknown-linux-gnu -- -max_total_time=30 -max_len=262144
          git diff --exit-code -- fuzz/Cargo.lock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fuzz-evidence
          path: |
            fuzz/Cargo.lock
            fuzz/artifacts

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
        with:
          tool: cargo-deny
      - run: cargo metadata --locked --format-version 1 > dependency-metadata.json
      - run: node .github/check-security.mjs
      - run: node .github/check-advisory-exposure.mjs
      - run: cargo deny --locked check advisories licenses
      - run: cargo deny --manifest-path fuzz/Cargo.toml --locked check advisories licenses

  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 .github/check-first-party.py
